[project]
name = "halim-voice-agents"
version = "0.1.0"
description = "Reservoice voice agent monorepo (LiveKit Agents)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "livekit-agents[deepgram,openai,elevenlabs,cartesia,silero,turn-detector]~=1.6.9",
    "python-dotenv~=1.0",
    "pyyaml~=6.0",
]

[dependency-groups]
dev = [
    "ruff~=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
package = false
